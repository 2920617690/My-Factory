[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myfactory-runtime"
version = "0.1.0"
description = "My Factory capability execution adapter"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic==2.13.5", "jsonschema==4.26.0", "fastapi==0.141.1", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
where = ["src"]
